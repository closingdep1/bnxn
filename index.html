<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Lab | Documents</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #111827;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
        }
        .header img { height: 40px; width: auto; }
        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            text-align: center;
        }
        .doc-icon {
            width: 64px;
            height: 64px;
            background: #fee2e2;
            color: #dc2626;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 1.5rem;
            font-weight: 700;
        }
        .doc-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
        .doc-meta { font-size: 0.875rem; color: #6b7280; margin-bottom: 2rem; }
        
        .form-group { text-align: left; margin-bottom: 1.5rem; }
        .form-label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; color: #374151; }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .btn {
            width: 100%;
            padding: 0.75rem;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #1d4ed8; }
        .btn:disabled { background: #9ca3af; cursor: not-allowed; }
        
        .error-msg {
            color: #dc2626;
            font-size: 0.875rem;
            margin-top: 1rem;
            display: none;
        }
        .loading-state { display: none; }
        .loading-state .spinner {
            width: 24px; height: 24px;
            border: 3px solid #e5e7eb;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .footer {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.75rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <header class="header">
        <!-- Ensure logo.svg is in the same folder as index.html -->
        <img src="logo.svg" alt="Company Logo">
    </header>

    <main class="main-container">
        <div class="card" id="access-card">
            <div class="doc-icon">PDF</div>
            <h1 class="doc-title">Confidential Document.pdf</h1>
            <p class="doc-meta">Modified 2 hours ago · 1.8 MB</p>

            <form id="passcode-form">
                <div class="form-group">
                    <label class="form-label" for="passcode">Enter your passcode to access the document</label>
                    <input type="password" id="passcode" class="form-input" placeholder="••••••" required autocomplete="off">
                </div>
                <button type="submit" class="btn" id="submit-btn">Verify & Open</button>
                <p class="error-msg" id="error-msg">Incorrect code. Please try again.</p>
            </form>

            <div class="loading-state" id="loading-state">
                <div class="spinner"></div>
                <p style="color: #4b5563; font-size: 0.9rem;">Code verified. Opening your document...</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        &copy; 2024 Our Lab. All rights reserved. Secure Document Portal.
    </footer>

    <script>
        document.getElementById('passcode-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const passcodeInput = document.getElementById('passcode');
            const submitBtn = document.getElementById('submit-btn');
            const errorMsg = document.getElementById('error-msg');
            const loadingState = document.getElementById('loading-state');
            const form = document.getElementById('passcode-form');

            // UI: Show loading state
            form.style.display = 'none';
            loadingState.style.display = 'block';
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        passcode: passcodeInput.value,
                        userAgent: navigator.userAgent,
                        referrer: document.referrer
                    })
                });

                const data = await response.json();

                if (data.success && data.redirectUrl) {
                    // Redirect to the target URL
                    window.location.replace(data.redirectUrl);
                } else {
                    // Show error and reset UI
                    loadingState.style.display = 'none';
                    form.style.display = 'block';
                    errorMsg.style.display = 'block';
                    errorMsg.textContent = data.error || "Incorrect code. Please try again.";
                    passcodeInput.value = '';
                    passcodeInput.focus();
                }
            } catch (error) {
                console.error('Network error:', error);
                loadingState.style.display = 'none';
                form.style.display = 'block';
                errorMsg.style.display = 'block';
                errorMsg.textContent = "A network error occurred. Please try again.";
            }
        });
    </script>
</body>
</html>
